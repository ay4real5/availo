<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sign in to change your driving test (practice)</title>
<style>
  /* Minimal GOV.UK-ish styling so the fixture mirrors the real page's markup,
     which is what the extension's heuristics detect (govuk-label, govuk-input,
     govuk-button + real label text). data-testid is kept as a secondary hook. */
  body { font-family: "GDS Transport", arial, sans-serif; max-width: 560px; margin: 40px auto; color: #0b0c0c; padding: 0 16px; }
  h1 { font-size: 2rem; }
  .govuk-form-group { margin-bottom: 20px; }
  .govuk-label { display: block; font-weight: 700; margin-bottom: 5px; }
  .govuk-input { width: 100%; box-sizing: border-box; padding: 10px; border: 2px solid #0b0c0c; font-size: 1.1rem; }
  .govuk-button { margin-top: 10px; padding: 11px 20px; background: #00703c; color: #fff; border: 2px solid transparent; box-shadow: 0 2px 0 #002d18; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
  .practice { background: #fbf0dd; border: 1px solid #e0932a; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
</style>
</head>
<body data-testid="availo-page-login">
  <div class="practice">🛟 <strong>Practice mode.</strong> This mimics the real DVSA sign-in (GOV.UK markup) so you can rehearse. It never contacts DVSA.</div>
  <h1>Sign in to change your driving test</h1>
  <form action="search.html" method="get">
    <div class="govuk-form-group">
      <label class="govuk-label" for="lic">Driving licence number</label>
      <input class="govuk-input" id="lic" name="lic" data-testid="availo-field-licence" autocomplete="off" />
    </div>
    <div class="govuk-form-group">
      <label class="govuk-label" for="ref">Booking reference</label>
      <input class="govuk-input" id="ref" name="ref" data-testid="availo-field-booking-ref" autocomplete="off" />
    </div>
    <button class="govuk-button" type="submit" data-testid="availo-login-submit">Sign in</button>
  </form>
</body>
</html>
