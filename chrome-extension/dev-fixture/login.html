<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sign in to change your driving test (practice)</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 560px; margin: 40px auto; color: #0b0c0c; padding: 0 16px; }
  h1 { border-bottom: 4px solid #2f6f62; padding-bottom: 8px; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 6px; border: 2px solid #b1b4b6; border-radius: 6px; font-size: 16px; }
  button { margin-top: 24px; padding: 11px 20px; background: #2f6f62; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
  .practice { background: #fbf0dd; border: 1px solid #e0932a; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
</style>
</head>
<body data-testid="availo-page-login">
  <div class="practice">🛟 <strong>Practice mode.</strong> This mimics the real DVSA sign-in so you can rehearse. It never contacts DVSA.</div>
  <h1>Sign in to change your driving test</h1>
  <form action="search.html" method="get">
    <label for="lic">Driving licence number</label>
    <input id="lic" name="lic" data-testid="availo-field-licence" autocomplete="off" />

    <label for="ref">Booking reference</label>
    <input id="ref" name="ref" data-testid="availo-field-booking-ref" autocomplete="off" />

    <button type="submit" data-testid="availo-login-submit">Sign in</button>
  </form>
</body>
</html>
