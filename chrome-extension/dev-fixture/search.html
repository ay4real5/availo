<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Find a test (practice)</title>
<style>
  body { font-family: "GDS Transport", arial, sans-serif; max-width: 560px; margin: 40px auto; color: #0b0c0c; padding: 0 16px; }
  h1 { font-size: 2rem; }
  .govuk-form-group { margin-bottom: 20px; }
  .govuk-label { display: block; font-weight: 700; margin-bottom: 5px; }
  .govuk-input { width: 100%; box-sizing: border-box; padding: 10px; border: 2px solid #0b0c0c; font-size: 1.1rem; }
  .govuk-button { margin-top: 10px; padding: 11px 20px; background: #00703c; color: #fff; border: 2px solid transparent; box-shadow: 0 2px 0 #002d18; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
  .practice { background: #fbf0dd; border: 1px solid #e0932a; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; gap: 14px; }
  .row > div { flex: 1; }
</style>
</head>
<body data-testid="availo-page-search">
  <div class="practice">🛟 <strong>Practice mode.</strong> Fast-Path filled the sign-in for you and landed here. Now it fills the search.</div>
  <h1>Find a test</h1>
  <form action="results.html" method="get">
    <div class="govuk-form-group">
      <label class="govuk-label" for="centre">Test centre</label>
      <input class="govuk-input" id="centre" name="centre" data-testid="availo-field-centre" autocomplete="off" />
    </div>
    <div class="row">
      <div class="govuk-form-group">
        <label class="govuk-label" for="from">Earliest date (from)</label>
        <input class="govuk-input" id="from" name="from" type="date" data-testid="availo-field-date-from" />
      </div>
      <div class="govuk-form-group">
        <label class="govuk-label" for="to">Latest date (to)</label>
        <input class="govuk-input" id="to" name="to" type="date" data-testid="availo-field-date-to" />
      </div>
    </div>
    <button class="govuk-button" type="submit" data-testid="availo-search-submit">Search for tests</button>
  </form>
</body>
</html>
