<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Find a test (practice)</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 560px; margin: 40px auto; color: #0b0c0c; padding: 0 16px; }
  h1 { border-bottom: 4px solid #2f6f62; padding-bottom: 8px; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 6px; border: 2px solid #b1b4b6; border-radius: 6px; font-size: 16px; }
  button { margin-top: 24px; padding: 11px 20px; background: #2f6f62; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
  .practice { background: #fbf0dd; border: 1px solid #e0932a; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; gap: 14px; }
  .row > div { flex: 1; }
</style>
</head>
<body data-testid="availo-page-search">
  <div class="practice">🛟 <strong>Practice mode.</strong> Fast-Path filled the sign-in for you and landed here. Now it fills the search.</div>
  <h1>Find a test</h1>
  <form action="results.html" method="get">
    <label for="centre">Test centre</label>
    <input id="centre" name="centre" data-testid="availo-field-centre" autocomplete="off" />

    <div class="row">
      <div>
        <label for="from">From</label>
        <input id="from" name="from" type="date" data-testid="availo-field-date-from" />
      </div>
      <div>
        <label for="to">To</label>
        <input id="to" name="to" type="date" data-testid="availo-field-date-to" />
      </div>
    </div>

    <button type="submit" data-testid="availo-search-submit">Search for tests</button>
  </form>
</body>
</html>
