<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Availo Fast-Path</title>
  <style>
    :root { --primary: #2f6f62; --primary-dark: #1f4e44; --accent: #e0932a; --ink: #232a22; --muted: #67766c; --danger: #c24e3a; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 288px; margin: 0; padding: 16px; color: var(--ink); }
    h1 { font-size: 15px; margin: 0 0 10px; color: var(--primary-dark); }
    p { font-size: 13px; color: var(--muted); margin: 4px 0; }
    button { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .primary { background: var(--primary); color: white; }
    .primary:hover { background: var(--primary-dark); }
    .accent { background: var(--accent); color: #1a1305; }
    .accent:hover { filter: brightness(0.95); }
    .stop { background: var(--danger); color: white; }
    .link { background: none; color: var(--primary-dark); text-decoration: underline; padding: 0; margin-top: 14px; font-weight: 600; }
    .status { font-size: 12px; padding: 8px 10px; border-radius: 8px; margin-top: 8px; }
    .status.watching { background: #e4f0ec; color: var(--primary-dark); }
    .status.idle { background: #f3f2f1; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Availo Fast-Path</h1>
  <div id="app">Loading…</div>
  <script src="popup.js"></script>
</body>
</html>
